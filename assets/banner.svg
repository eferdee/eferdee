<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="M. Farid Saputra — Informatics Graduate">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06141a"/><stop offset=".55" stop-color="#0a2b30"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#99f6e4"/></linearGradient>
<radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#99f6e4" opacity=".16"/></pattern>
<clipPath id="r"><rect width="1000" height="280" rx="22"/></clipPath>
</defs>
<style>
.orb1{animation:f1 9s ease-in-out infinite alternate}.orb2{animation:f2 11s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(40px,18px)}}@keyframes f2{to{transform:translate(-36px,-14px)}}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.line{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.2s .6s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="280" fill="url(#bg)"/><rect width="1000" height="280" fill="url(#dots)"/>
<circle class="orb1" cx="860" cy="60" r="190" fill="url(#g1)"/><circle class="orb2" cx="140" cy="300" r="170" fill="url(#g1)" opacity=".7"/>
<g fill="none" stroke="#99f6e4" stroke-opacity=".18"><circle cx="840" cy="150" r="96"/><circle cx="840" cy="150" r="146"/><circle cx="840" cy="150" r="196"/></g>
<text class="rise d1" x="64" y="88" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#99f6e4" letter-spacing="2">HI, I'M FARID 👋</text>
<text class="rise d2" x="62" y="152" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.2">M. Farid Saputra<tspan fill="#2dd4bf">.</tspan></text>
<path class="line" d="M64 176 H304" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" fill="none"/>
<text class="rise d3" x="64" y="214" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#d8efee">Informatics Graduate<tspan fill="#2dd4bf"> · </tspan>Web Development<tspan fill="#2dd4bf"> · </tspan>Machine Learning<tspan fill="#2dd4bf"> · </tspan>Data</text>
<text class="rise d4" x="64" y="246" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8fb8b6">Turning ideas and data into practical digital solutions<tspan class="blink" fill="#2dd4bf"> ▍</tspan></text>
</g></svg>